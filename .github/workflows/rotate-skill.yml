name: AI Skill Marker Rotation

on:
  workflow_call:
    inputs:
      skill_path:
        description: Path to the target repository SKILL file
        required: false
        default: SKILL.md
        type: string
      marker_length:
        description: Length of each generated marker
        required: false
        default: 4
        type: number

jobs:
  rotate-markers:
    name: Rotate skill markers
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          path: target

      - name: Checkout integrity framework
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: integrity

      - name: Decide whether SKILL content changed
        id: skill-change
        shell: bash
        run: |
          set -euo pipefail
          cd target
          SKILL='${{ inputs.skill_path }}'

          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="$RUNNER_TEMP/aici-skill-before.md"
          AFTER="$RUNNER_TEMP/aici-skill-after.md"

          if git cat-file -e "HEAD^:$SKILL" 2>/dev/null; then
            git show "HEAD^:$SKILL" > "$BEFORE"
          else
            : > "$BEFORE"
          fi
          cp "$SKILL" "$AFTER"

          if [[ ! -s "$BEFORE" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif python3 ../integrity/aici.py changed --before "$BEFORE" --after "$AFTER"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rotate every marker
        if: steps.skill-change.outputs.changed == 'true'
        id: rotate
        shell: bash
        run: |
          set -euo pipefail
          KEY=$(python3 integrity/aici.py rotate \
            --skill "target/${{ inputs.skill_path }}" \
            --length '${{ inputs.marker_length }}')
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Commit rotated markers
        if: steps.skill-change.outputs.changed == 'true'
        shell: bash
        env:
          CONTEXT_KEY: ${{ steps.rotate.outputs.key }}
        run: |
          set -euo pipefail
          cd target
          git config user.name "ai-commit-integrity[bot]"
          git config user.email "ai-commit-integrity[bot]@users.noreply.github.com"
          git add '${{ inputs.skill_path }}'

          if git diff --cached --quiet; then
            echo "No marker changes to commit."
            exit 0
          fi

          git commit -m "chore: rotate AI context markers" \
            -m "AI-Context-Key: ${CONTEXT_KEY}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
